<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="%sveltekit.assets%/fonts/bricolage-wght.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			/* Self-hosted, SIL Open Font License 1.1 (static/fonts/OFL-*.txt). %sveltekit.assets% keeps the paths valid under any base. */
			@font-face {
				font-family: 'Bricolage Grotesque';
				font-weight: 200 800;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/bricolage-wght.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Libre Caslon Text';
				font-style: italic;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/caslon-italic.woff2') format('woff2');
			}
		</style>
		<script>
			// The greeting draws once per session (context/assets/greeting/README.md).
			// .js lets CSS tell a scripted page from the plain no-JS one.
			document.documentElement.classList.add('js');
			try {
				if (sessionStorage.getItem('greeted')) document.documentElement.classList.add('hi-still');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
