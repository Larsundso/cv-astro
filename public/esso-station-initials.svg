<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 64" width="56" height="64" role="img" aria-label="E">
  <!-- Esso-Station — initials fallback ("E", ink on transparent; the
       letterhead chip supplies the paper ground). DELIBERATELY NOT the Esso
       brand mark: that is a registered trademark, and the employer named on
       the Arbeitszeugnis is a franchise operator rather than the brand.
       Geometry and stroke match raleo-initials.svg so the two letterheads
       read as one hand. -->
  <g fill="none" stroke="#27201a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 18 12 V 52" />
    <path d="M 18 12 H 42" />
    <path d="M 18 32 H 37" />
    <path d="M 18 52 H 42" />
  </g>
</svg>
